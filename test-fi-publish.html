<!DOCTYPE html>
<html>
<head>
    <title>Test FI Publish</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 4px;
            white-space: pre-wrap;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
    </style>
</head>
<body>
    <h1>Test Forklift International Publish</h1>

    <div class="form-group">
        <label>Supabase URL:</label>
        <input type="text" id="supabaseUrl" value="https://wcjegvxnojzirwxogesj.supabase.co">
    </div>

    <div class="form-group">
        <label>Auth Token (from browser dev tools):</label>
        <input type="text" id="authToken" placeholder="Paste your auth token here">
    </div>

    <div class="form-group">
        <label>Dossier ID:</label>
        <input type="text" id="dossierId" placeholder="Enter dossier UUID">
    </div>

    <div class="form-group">
        <label>FI Username:</label>
        <input type="text" id="fiUsername" placeholder="Your FI username">
    </div>

    <div class="form-group">
        <label>FI Password:</label>
        <input type="password" id="fiPassword" placeholder="Your FI password">
    </div>

    <div class="form-group">
        <label>
            <input type="checkbox" id="testMode" checked> Test Mode (don't upload, just show XML)
        </label>
    </div>

    <button onclick="testPublish()">Test Publish</button>

    <div id="result"></div>

    <script>
        async function testPublish() {
            const supabaseUrl = document.getElementById('supabaseUrl').value;
            const authToken = document.getElementById('authToken').value;
            const dossierId = document.getElementById('dossierId').value;
            const fiUsername = document.getElementById('fiUsername').value;
            const fiPassword = document.getElementById('fiPassword').value;
            const testMode = document.getElementById('testMode').checked;

            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="result">Testing...</div>';

            try {
                const response = await fetch(
                    `${supabaseUrl}/functions/v1/publish-to-forklift-international`,
                    {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${authToken}`,
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            dossierIds: [dossierId],
                            fiUsername: fiUsername,
                            fiPassword: fiPassword,
                            testMode: testMode
                        })
                    }
                );

                const result = await response.json();

                if (response.ok) {
                    resultDiv.innerHTML = `<div class="result success">
<strong>Success!</strong>

${JSON.stringify(result, null, 2)}
</div>`;
                } else {
                    resultDiv.innerHTML = `<div class="result error">
<strong>Error!</strong>

${JSON.stringify(result, null, 2)}
</div>`;
                }
            } catch (error) {
                resultDiv.innerHTML = `<div class="result error">
<strong>Exception!</strong>

${error.message}
${error.stack || ''}
</div>`;
            }
        }

        // Instructions
        console.log(`
To get your auth token:
1. Open your app in the browser
2. Open Developer Tools (F12)
3. Go to Application/Storage → Local Storage
4. Find 'sb-wcjegvxnojzirwxogesj-auth-token'
5. Copy the 'access_token' value
6. Paste it in the Auth Token field
        `);
    </script>
</body>
</html>
